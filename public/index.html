<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustRx - Decentralized Health Oracle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .submissions {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .submission-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .submission-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .disease-tag {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .risk-score {
            font-size: 1.5rem;
            font-weight: 700;
            color: #764ba2;
        }

        .transaction-id {
            font-family: monospace;
            font-size: 0.85rem;
            color: #666;
            word-break: break-all;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
        }

        .config-section {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .config-section h3 {
            color: #856404;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 TrustRx</h1>
            <p>Decentralized AI-Powered Health Oracle on Hedera</p>
        </header>

        <div class="grid">
            <!-- Configuration Card -->
            <div class="card">
                <h2>⚙️ Configure Hedera</h2>
                <div class="config-section">
                    <h3>First Time Setup</h3>
                    <p style="font-size: 0.9rem; color: #856404;">Enter your Hedera testnet credentials to get started.</p>
                </div>
                <div class="form-group">
                    <label>Account ID</label>
                    <input type="text" id="accountId" placeholder="0.0.1234567">
                </div>
                <div class="form-group">
                    <label>Private Key</label>
                    <input type="password" id="privateKey" placeholder="302e...">
                </div>
                <button onclick="configureHedera()">Connect to Hedera</button>
                <div id="configStatus" class="status"></div>
            </div>

            <!-- Report Case Card -->
            <div class="card">
                <h2>📊 Report Health Case</h2>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="location" placeholder="e.g., Ikeja, Lagos">
                </div>
                <div class="form-group">
                    <label>Disease</label>
                    <select id="disease">
                        <option value="">Select disease...</option>
                        <option value="Malaria">Malaria</option>
                        <option value="Cholera">Cholera</option>
                        <option value="Typhoid">Typhoid</option>
                        <option value="COVID-19">COVID-19</option>
                        <option value="Lassa Fever">Lassa Fever</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Number of Cases</label>
                    <input type="number" id="cases" placeholder="e.g., 5" min="1">
                </div>
                <div class="form-group">
                    <label>Severity</label>
                    <select id="severity">
                        <option value="mild">Mild</option>
                        <option value="moderate">Moderate</option>
                        <option value="severe">Severe</option>
                    </select>
                </div>
                <button onclick="submitCase()">Submit to Hedera Blockchain</button>
                <div id="submitStatus" class="status"></div>
            </div>
        </div>

        <!-- Submissions List -->
        <div class="submissions">
            <h2>🔐 Verified Health Reports (On-Chain)</h2>
            <div id="submissionsList">
                <div class="empty-state">
                    <p>No submissions yet. Report your first case above!</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';

        async function configureHedera() {
            const accountId = document.getElementById('accountId').value;
            const privateKey = document.getElementById('privateKey').value;
            const status = document.getElementById('configStatus');

            if (!accountId || !privateKey) {
                showStatus(status, 'Please enter both Account ID and Private Key', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/configure`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accountId, privateKey })
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus(status, '✅ Connected to Hedera Testnet!', 'success');
                } else {
                    showStatus(status, `❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showStatus(status, `❌ Connection failed: ${error.message}`, 'error');
            }
        }

        async function submitCase() {
            const location = document.getElementById('location').value;
            const disease = document.getElementById('disease').value;
            const cases = document.getElementById('cases').value;
            const severity = document.getElementById('severity').value;
            const status = document.getElementById('submitStatus');

            if (!location || !disease || !cases) {
                showStatus(status, 'Please fill in all required fields', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/submit-case`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ location, disease, cases: parseInt(cases), severity })
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus(status, '✅ Case recorded on Hedera blockchain!', 'success');
                    clearForm();
                    loadSubmissions();
                } else {
                    showStatus(status, `❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showStatus(status, `❌ Submission failed: ${error.message}`, 'error');
            }
        }

        async function loadSubmissions() {
            try {
                const response = await fetch(`${API_BASE}/submissions`);
                const data = await response.json();

                const list = document.getElementById('submissionsList');

                if (data.submissions.length === 0) {
                    list.innerHTML = '<div class="empty-state"><p>No submissions yet. Report your first case above!</p></div>';
                    return;
                }

                list.innerHTML = data.submissions.map(sub => `
                    <div class="submission-item">
                        <div class="submission-header">
                            <div>
                                <span class="disease-tag">${sub.disease}</span>
                                <strong style="margin-left: 10px;">${sub.location}</strong>
                            </div>
                            <div class="risk-score">${sub.analysis.riskScore}% Risk</div>
                        </div>
                        <p><strong>Cases:</strong> ${sub.cases} | <strong>Severity:</strong> ${sub.severity}</p>
                        <p><strong>AI Analysis:</strong> ${sub.analysis.recommendation} (${sub.analysis.confidence}% confidence)</p>
                        <p><strong>Timestamp:</strong> ${new Date(sub.timestamp).toLocaleString()}</p>
                        <p class="transaction-id"><strong>Hedera TX:</strong> ${sub.transactionId}</p>
                        <p class="transaction-id"><strong>Topic ID:</strong> ${sub.topicId}</p>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load submissions:', error);
            }
        }

        function showStatus(element, message, type) {
            element.textContent = message;
            element.className = `status ${type}`;
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, 5000);
        }

        function clearForm() {
            document.getElementById('location').value = '';
            document.getElementById('disease').value = '';
            document.getElementById('cases').value = '';
            document.getElementById('severity').value = 'moderate';
        }

        // Load submissions on page load
        window.addEventListener('load', loadSubmissions);
    </script>
</body>
</html>
